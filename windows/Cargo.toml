[package]
name = "reimsbridge-windows"
version = "0.1.0"
edition = "2024"
default-run = "reimsbridge-windows"

[dependencies]
clipboard-win = { version = "5.4.3", features = ["std"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh2 = { version = "0.9.7", features = ["openssl-on-win32", "vendored-openssl"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
