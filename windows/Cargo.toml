[package]
name = "reimsbridge-windows"
version = "0.1.0"
edition = "2024"
default-run = "reimsbridge-windows"

[dependencies]
clipboard-win = { version = "5.4.3", features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
libssh2-sys = "0.3.4"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ssh2 = { version = "0.9.7", features = ["openssl-on-win32", "vendored-openssl"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
